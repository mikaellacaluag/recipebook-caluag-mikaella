{% extends 'base.html' %}
{% load static %} 

{% block header %} <h3>Recipe List </h3>{% endblock %}

{% block content %}
        <ul>
            {% for recipe in recipes %}
            <li>
                <a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a>
            </li>
            {% endfor %}
        </ul>

        {% if user.is_authenticated %}
            <a href="{% url 'ledger:add_recipe' %}">Add New Recipe</a>
        {% endif %}
{% endblock %}
