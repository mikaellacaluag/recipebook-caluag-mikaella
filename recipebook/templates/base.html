<!DOCTYPE html>
<html lang="en-US">
    <head>
        <link rel="stylesheet" href="style.css">
        <title>{% block title %} Recipe Book {% endblock %}</title>
        {% block styles %}{% endblock %}
    </head>
    <body>
        <header>
            {% block header %} <h1>Recipe Book</h1>{% endblock %}
        </header>
        <div id="content">
            {% block content %}{% endblock %}
        </div>
        {% block scripts %}{% endblock %}
    </body>
</html>
